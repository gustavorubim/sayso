[package]
name = "sayso-core"
version = "0.4.0"
description = "Native core for Sayso: global hotkey, audio capture, local speech-to-text, and paste."
license = "MIT"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
sherpa-onnx = "2.0.1"
global-hotkey = "0.10"
ureq = { version = "2.12", features = ["json"] }
arboard = "3"
enigo = "0.6"
regex = "1"
num_cpus = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
