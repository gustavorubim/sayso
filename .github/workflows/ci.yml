name: CI

# Runs on every pull request and every push to main. The release workflow also calls it, so
# nothing is released that has not passed these checks.
#
# Pull requests skip macOS and the stress tests to stay quick and cheap (macOS costs ten
# times as much on a private repository). Pushes to main, releases, and manual runs do
# everything.

on:
  pull_request:
  push:
    branches: [main]
    # A push that only touches documentation has nothing to build or test.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_call:
    inputs:
      skip-packaged-app:
        description: >
          Do not build and smoke-test the app here. The release workflow sets this because
          it smoke-tests the very installers it is about to publish.
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  interface:
    name: Interface (format, lint, types, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          rust: 'false'
          node: 'true'
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm run test

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04","windows-latest"]' || '["ubuntu-22.04","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          rust-components: rustfmt, clippy
          rust-cache: debug

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path core/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml

  # Real recordings through real speech models: accuracy, short recordings, long recordings,
  # other sample rates, silence, and writing as you speak. This is what catches a change that
  # makes dictation worse while every unit test still passes. See core/src/audio_tests.rs.
  #
  # Whisper Large v3 Turbo is here on purpose: the regression shipped in 0.4.0 showed on it
  # and not on smaller Whisper models. Recognition does not depend on the operating system,
  # so this runs on Linux only; the smoke test covers each system's packaged engine.
  audio:
    name: Audio tests
    runs-on: ubuntu-22.04
    env:
      SAYSO_TEST_DATA: ${{ github.workspace }}/.speech-models
      SAYSO_TEST_MODELS: canary-180m-flash,whisper-large-v3-turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          rust-cache: debug

      - name: Restore the speech models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .speech-models
          key: speech-audio-${{ hashFiles('core/src/models.rs') }}

      - name: Download the speech models (verified against their checksums)
        run: >
          cargo run --manifest-path core/Cargo.toml -- fetch --data-dir "$SAYSO_TEST_DATA"
          canary-180m-flash whisper-large-v3-turbo

      - name: Audio regression tests
        run: cargo test --manifest-path core/Cargo.toml audio_tests -- --ignored --test-threads=1 --nocapture

      # Hundreds of dictations in a row, model switching, ten-minute recordings, hostile
      # input. Slow, so not on pull requests. See core/src/stress_tests.rs.
      - name: Stress tests
        if: github.event_name != 'pull_request'
        run: cargo test --manifest-path core/Cargo.toml stress_tests -- --ignored --test-threads=1 --nocapture

  # Builds the app the way a release does, starts it, and has it check itself: the engine
  # runs, every screen opens, the icons are there, a recording is transcribed. Then the engine
  # process is flooded, crashed and restarted. This catches packaging mistakes that no unit
  # test can see. The checks are in src/main/smoke.ts and scripts/stress-core.mjs.
  smoke:
    name: Packaged app (${{ matrix.os }})
    # The input does not exist on a pull request or a push, where this must run.
    if: ${{ !inputs.skip-packaged-app }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04","windows-latest"]' || '["ubuntu-22.04","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          rust-cache: release
          node: 'true'

      - name: Build the unpacked app
        run: npm run pack:dir

      - uses: ./.github/actions/test-packaged-app

  # One required status check for branch protection, whatever the matrix looks like.
  ci-ok:
    name: CI passed
    if: always()
    needs: [interface, core, audio, smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ needs.interface.result }} ${{ needs.core.result }} ${{ needs.audio.result }}
          PACKAGED: ${{ needs.smoke.result }}
          SKIP_PACKAGED: ${{ inputs.skip-packaged-app && 'yes' || 'no' }}
        run: |
          echo "Job results: $RESULTS; packaged app: $PACKAGED (skipping allowed: $SKIP_PACKAGED)"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
          # The packaged-app job may be skipped only when the release workflow asked for
          # that, because it tests the installers itself. Skipped by accident is a failure.
          if [ "$PACKAGED" = "success" ]; then exit 0; fi
          if [ "$PACKAGED" = "skipped" ] && [ "$SKIP_PACKAGED" = "yes" ]; then exit 0; fi
          echo "The packaged-app job did not run or did not succeed."
          exit 1
