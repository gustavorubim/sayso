name: Release

# Push a tag like v0.2.0 to build installers for Windows, macOS and Linux and attach them
# to a draft GitHub release. Review the draft, then publish it.
#
# A tag with a suffix, like v0.5.0-beta.1, makes a pre-release: it never becomes "latest"
# and is not offered to people through auto-update unless they already run a beta.
#
# What gets published is what was tested. Each system builds its installers once, then the
# app from that same build is started, checks itself, transcribes a recording and has its
# engine stressed. Only if that passes are the installers uploaded.
#
# Run it by hand from the Actions tab for a rehearsal: everything above happens, nothing is
# published, and the installers are kept as workflow artifacts for three days.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Read-only by default; the jobs that touch the release ask for write access themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests, audio tests and stress tests on the tagged commit. The packaged-app test
  # is left to the build job below, which runs it on the real installers.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      skip-packaged-app: true

  draft:
    name: Create draft release
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version."
            echo "Run: npm run version:set -- ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Create the draft (skipped if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease

  build:
    name: Build and test (${{ matrix.name }})
    needs: [checks, draft]
    # The draft job is skipped in a rehearsal; that must not skip the build.
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            engine: sherpa-onnx-v2.0.1-win-x64-static-MT-Release-lib.tar.bz2
            engine_sha256: 23e7b986b197eda0bbc47ff3d7d5c87afd6ef2b9077214ba26b0f1ec52ef0e66
          # Apple silicon only. Intel Macs are not supported.
          - name: macOS Apple silicon
            os: macos-latest
            engine: sherpa-onnx-v2.0.1-osx-arm64-static-lib.tar.bz2
            engine_sha256: d7a9b14f337958e7373c8c650f046df33d210bbaff2f33cb8322dda663ee5e1c
          - name: Linux x64
            os: ubuntu-22.04
            engine: sherpa-onnx-v2.0.1-linux-x64-static-lib.tar.bz2
            engine_sha256: 55cfadf65ba50d0afc1a802b7a337942819e51c94a5b5a384def1978f7c70871
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build cache: what is released is always compiled from scratch.
      - uses: ./.github/actions/prepare
        with:
          node: 'true'

      # The speech engine is a prebuilt native library that gets linked into the app. Fetch
      # it here and check it against a known checksum, so a replaced upstream file cannot end
      # up in an installer. Update `engine` and `engine_sha256` when bumping sherpa-onnx.
      - name: Fetch and verify the speech engine
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/engine"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/engine/${{ matrix.engine }}" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/${{ matrix.engine }}"
          actual=$(openssl dgst -sha256 "$RUNNER_TEMP/engine/${{ matrix.engine }}" | awk '{print $NF}')
          if [ "$actual" != "${{ matrix.engine_sha256 }}" ]; then
            echo "Checksum mismatch for ${{ matrix.engine }}: got $actual"
            exit 1
          fi
          echo "SHERPA_ONNX_ARCHIVE_DIR=$RUNNER_TEMP/engine" >> "$GITHUB_ENV"

      # Compile everything before any secret is in reach: build scripts of dependencies run
      # here and must not be able to see signing credentials.
      - name: Build the core and the interface
        run: |
          npm run core:release
          npm run build

      # Only this step sees the optional signing secrets. A secret that is not set arrives
      # as an empty string, and an empty CSC_LINK makes electron-builder fail, so drop the
      # empty ones first. Without the signing secrets the macOS app is signed ad hoc; see
      # scripts/package.mjs. Nothing is uploaded here.
      - name: Package the installers
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              unset "$name"
            fi
          done
          node scripts/package.mjs --publish never

      # The app that was just packaged, not a separate test build.
      - uses: ./.github/actions/test-packaged-app

      - name: List what will be published
        id: files
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.exe.blockmap dist/*.dmg dist/*.dmg.blockmap dist/*.zip dist/*.zip.blockmap dist/*.AppImage dist/*.deb dist/latest*.yml)
          if [ ${#files[@]} -lt 2 ]; then
            echo "Expected installers and update metadata in dist/, found: ${files[*]}"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          { echo 'list<<EOF'; printf '%s\n' "${files[@]}"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Upload to the draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.files.outputs.list }}
        run: |
          # (No `mapfile`: the macOS runner's bash is too old for it.)
          files=()
          while IFS= read -r file; do
            [ -n "$file" ] && files+=("$file")
          done <<< "$FILES"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Keep the installers (rehearsal)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rehearsal-${{ runner.os }}
          path: ${{ steps.files.outputs.list }}
          retention-days: 3
