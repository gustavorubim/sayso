name: Prepare
description: >
  Installs what the jobs build with: the Linux libraries, Rust, and Node with the project's
  packages. One place, so the workflows do not each carry their own copy.

inputs:
  rust:
    description: Install the Rust toolchain.
    default: 'true'
  rust-components:
    description: Extra toolchain components, such as "rustfmt, clippy".
    default: ''
  rust-cache:
    description: >
      Name of the build cache to restore and save. Jobs that build the same way share a
      name. Empty means no cache: release builds always compile from scratch.
    default: ''
  node:
    description: Install Node and the project's npm packages.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Linux libraries
      if: runner.os == 'Linux' && inputs.rust == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxi-dev libxtst-dev libxdo-dev xvfb

    - if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: ${{ inputs.rust-components }}

    - if: inputs.rust == 'true' && inputs.rust-cache != ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: core
        shared-key: ${{ inputs.rust-cache }}

    # The speech engine's build script downloads a prebuilt library into
    # core/target/sherpa-onnx-prebuilt and skips the download when that folder exists. The
    # build cache keeps the folder but not the files in it, so a restored cache can leave an
    # empty folder that looks complete, and linking then fails with "could not find native
    # static library". If the library is not really there, clear the folder and the build
    # script's own record, so the script runs again and fetches it.
    - name: Drop an incomplete speech engine from the cache
      if: inputs.rust == 'true' && inputs.rust-cache != ''
      shell: bash
      run: |
        prebuilt=core/target/sherpa-onnx-prebuilt
        if [ -d "$prebuilt" ] && [ -z "$(find "$prebuilt" -type f \( -name '*.a' -o -name '*.lib' \) -print -quit)" ]; then
          echo "The cached speech engine folder has no library in it; it will be fetched again."
          rm -rf "$prebuilt"
          rm -rf core/target/*/build/sherpa-onnx-sys-* core/target/*/.fingerprint/sherpa-onnx-sys-*
        fi

    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    - if: inputs.node == 'true'
      shell: bash
      run: npm ci
