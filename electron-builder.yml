appId: com.sayso.app
productName: Sayso
copyright: Copyright © Sayso contributors

directories:
  buildResources: build
  output: dist

files:
  - out/**
  # Tray and window icons, loaded at runtime by the main process.
  - resources/**
  - package.json

# Switch off the ways a packaged Electron app can be made to run other code: as a plain
# Node.js runtime, through NODE_OPTIONS or --inspect, or from files outside the signed archive.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# The Rust core is shipped next to the app, outside the asar archive.
extraResources:
  - from: core/target/release
    to: bin
    filter:
      - sayso-core
      - sayso-core.exe

win:
  target: nsis
  artifactName: Sayso-${version}-windows-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  artifactName: Sayso-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Sayso records your voice while the dictation shortcut is active and turns it into text on this Mac.

linux:
  category: Utility
  target:
    - AppImage
    - deb
  artifactName: Sayso-${version}-linux-${arch}.${ext}

publish:
  provider: github
  releaseType: draft
